[workspace]
resolver = "3"
# A new member needs a policy entry in scripts/check-dependency-direction.sh
# and a row in ARCHITECTURE.md.
members = [
    # crates:begin
    "crates/tmpl-cli-store",
    "crates/tmpl-cli-core",
    "crates/tmpl-cli",
    # crates:end
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# 1.89 stabilized `File::try_lock`, which cw-fs's advisory lock uses; the
# kit states the same floor.
rust-version = "1.89"
license = "MIT"
# template:begin
# Nothing here is published to a registry. `scripts/init.sh --repository <url>`
# adds the repository URL; without it the field is left out.
# copy: # Nothing here is published to a registry.
# template:end
publish = false

[workspace.dependencies]
# The cw-kit (https://github.com/constellation-works/satellites): the one
# error type and a clock (cw-base), file access for a private data
# directory (cw-fs), one private SQLite database (cw-sqlite, which bundles
# SQLite and re-exports rusqlite), the command path (cw-app: the chokepoint,
# the environment captured once and the audit log), the command line's
# mechanism (cw-cli: the terminal decision, the output sink, error
# rendering, logging and grouped help) and the MCP surface (cw-mcp: a stdio
# server over typed tools that run through the same entry point). No
# release is published yet, so the workspace pins one commit of the
# satellites `agent-main` for every kit crate; moving the pin is a change of
# its own.
cw-app = { git = "https://github.com/constellation-works/satellites", rev = "9c9cc998720f0a75041be3451c14fbaf80f29dc8" }
cw-cli = { git = "https://github.com/constellation-works/satellites", rev = "9c9cc998720f0a75041be3451c14fbaf80f29dc8" }
cw-mcp = { git = "https://github.com/constellation-works/satellites", rev = "9c9cc998720f0a75041be3451c14fbaf80f29dc8" }
cw-base = { git = "https://github.com/constellation-works/satellites", rev = "9c9cc998720f0a75041be3451c14fbaf80f29dc8" }
cw-fs = { git = "https://github.com/constellation-works/satellites", rev = "9c9cc998720f0a75041be3451c14fbaf80f29dc8" }
cw-sqlite = { git = "https://github.com/constellation-works/satellites", rev = "9c9cc998720f0a75041be3451c14fbaf80f29dc8" }
# Test isolation (a private temp root, an isolated child, goldens): a
# dev-dependency only (scripts/check-dependency-direction.sh).
cw-testkit = { git = "https://github.com/constellation-works/satellites", rev = "9c9cc998720f0a75041be3451c14fbaf80f29dc8" }
# crates:begin
tmpl-cli-store = { path = "crates/tmpl-cli-store" }
tmpl-cli-core = { path = "crates/tmpl-cli-core" }
# crates:end
# No `color` or `wrap_help`: both make clap query the terminal itself, and the
# output sink is the only place allowed to do that (STD-01 R17). Help is plain
# text everywhere, which also keeps the help goldens byte-stable.
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tracing = "0.1"
# No `ansi`: log lines go to stderr as plain text in every mode.
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter"] }

[profile.release]
strip = true

# STD-02 lint baseline, verbatim from the standard. Do not trim it; add to it.
# Workspace-wide lint config. Each crate opts in via `[lints] workspace = true`.
# Keep this list short — only rules that are mechanically true everywhere.
[workspace.lints.clippy]
await_holding_lock = "deny"
dbg_macro = "deny"
# File, environment and process boundaries: the paths are in clippy.toml.
disallowed_methods = "deny"
disallowed_types = "deny"
expect_used = "warn"
print_stderr = "warn"
print_stdout = "warn"
unwrap_used = "warn"

# Adoptable additions beyond the baseline (STD-02 "Adoptable additions").
# STD-02 R27: no wildcard arm on an enum match; a foreign enum that needs one
# gets a scoped #[allow] with its reason.
wildcard_enum_match_arm = "warn"
match_wildcard_for_single_variants = "warn"
# STD-02 R28: narrowing `as` casts must be checked conversions.
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
# STD-12 R14: no one-letter bindings; clippy.toml empties the lint's default
# allow-list.
min_ident_chars = "warn"
# STD-12 R15: no glob imports, apart from the lints' own default exceptions.
wildcard_imports = "warn"
enum_glob_use = "warn"

[workspace.lints.rust]
# STD-12 R18: every public item carries a doc comment.
missing_docs = "warn"
