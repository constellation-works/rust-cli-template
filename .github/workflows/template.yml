# The template's own checks; scripts/init.sh deletes this workflow from a copy.
name: template
on:
  push: { branches: [agent-main] }
  pull_request:
permissions:
  contents: read
# As in ci.yml: a newer push cancels the run it supersedes, except on
# agent-main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/agent-main' }}
jobs:
  # A pull request that changes a shipped file raises version in template.toml.
  version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: The template version is raised
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/check-template-version.sh "origin/$BASE_REF"

  # One job per kind: initialize a scratch copy, check that none of the
  # template's own text is left, then run the copy's full gate.
  init:
    name: init (${{ matrix.kind }})
    strategy:
      fail-fast: false
      matrix:
        kind: [cli, cli-bare, workspace]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STANDARDS_STRICT: "1"
      KIND: ${{ matrix.kind }}
    # Pinned as in ci.yml (STD-05 R23).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the pinned toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >>"$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with: { toolchain: "${{ steps.toolchain.outputs.channel }}", components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { key: "${{ matrix.kind }}" }
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with: { tool: "cargo-nextest@0.9.136,cargo-deny@0.19.9" }
      - name: Initialize a scratch copy
        run: |
          scratch="$RUNNER_TEMP/copy"
          mkdir "$scratch"
          git archive HEAD | tar -x -C "$scratch"
          # One kind exercises --repository; the others leave it out.
          set --
          [ "$KIND" = cli ] && set -- --repository https://example.com/demo-cli
          (cd "$scratch" && scripts/init.sh demo-cli --kind "$KIND" "$@")
          # The copy's gates read the tracked files, as in a new repository.
          git -C "$scratch" init -q
          git -C "$scratch" add -A
          echo "SCRATCH=$scratch" >>"$GITHUB_ENV"
      - name: No template text is left
        run: |
          if git -C "$SCRATCH" grep -n -I -i \
              -e 'rust-cli-template' -e 'starting point for a new constellation Rust CLI' \
              -- . ':(exclude)docs/standards'; then
            echo "::error::the $KIND copy still carries the template's own name or summary"
            exit 1
          fi
      - name: make ci in the copy
        run: make -C "$SCRATCH" ci
