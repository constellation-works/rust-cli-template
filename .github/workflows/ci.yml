name: ci
on:
  # main receives only releases of commits that already passed here.
  push: { branches: [agent-main] }
  pull_request:
permissions:
  contents: read
# One run per branch or pull request: a newer push cancels the run it
# supersedes, except on agent-main, where every merged commit keeps its run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/agent-main' }}
jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        # Both: path handling and file locking differ between them.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # A hard wall-clock bound outside the process (STD-03 R22); nextest's
    # per-test timeouts are the inner bound.
    timeout-minutes: 30
    env:
      # In CI a missing docs/standards/ vendor is a failure, not a warning.
      # (GitHub also sets CI=true, which makes a missing gate tool fail.)
      STANDARDS_STRICT: "1"
    # Every input is pinned to an immutable id (STD-05 R23): actions by full
    # commit SHA (the tag in the comment is for humans and Dependabot), the
    # toolchain by version in rust-toolchain.toml, and each tool by version;
    # install-action checks every download against the SHA-256 recorded in
    # its manifest.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the pinned toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >>"$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with: { toolchain: "${{ steps.toolchain.outputs.channel }}", components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with: { tool: "cargo-nextest@0.9.136,cargo-deny@0.19.9" }
      - run: make ci

  # The oldest Rust the code supports (`rust-version` in Cargo.toml) still
  # builds every target; the pinned toolchain above is newer.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the minimum supported Rust
        id: msrv
        run: echo "version=$(make -s msrv-version)" >>"$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with: { toolchain: "${{ steps.msrv.outputs.version }}" }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { key: msrv }
      - run: make msrv
