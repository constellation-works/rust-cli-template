[package]
name = "tmpl-cli-store"
description = "The tmpl-cli data directory: the database, one repository per record, and the record shapes. No rules, no terminal, no argument parsing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "tmpl_cli_store"
path = "src/lib.rs"

[features]
# Hand-made store state for other crates' tests: raw SQL run on the
# database, so no crate outside this one names rusqlite.
test-support = []

# Persistence dependencies only. scripts/check-dependency-direction.sh rejects
# clap, tracing-subscriber and any other surface crate here.
[dependencies]
cw-base = { workspace = true }
cw-fs = { workspace = true }
cw-sqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
cw-testkit = { workspace = true }
time = { workspace = true, features = ["macros"] }

[lints]
workspace = true
