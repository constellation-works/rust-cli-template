[package]
name = "tmpl-cli"
description = "A command-line tool with a private local store."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "tmpl_cli"
path = "src/lib.rs"

[[bin]]
name = "tmpl-cli"
path = "src/main.rs"

[dependencies]
tmpl-cli-core = { workspace = true }
cw-cli = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }

[dev-dependencies]
cw-testkit = { workspace = true }
# Hand-made store state (a bad record, the last id, a newer schema) for
# the tests, through the store's raw-SQL test support.
tmpl-cli-store = { workspace = true, features = ["test-support"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
time = { workspace = true, features = ["macros"] }

[lints]
workspace = true
