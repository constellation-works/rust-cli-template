[package]
name = "tmpl-cli-core"
description = "The tmpl-cli apps as a library: one exec per app, the runtime they share, and composition. No terminal, no argument parsing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "tmpl_cli_core"
path = "src/lib.rs"

[features]
# Exposes the runtime context and each app's `run` (exec without the runtime
# start) to tests that need a pinned clock or a short lock wait.
test-support = []

# Domain dependencies only. scripts/check-dependency-direction.sh rejects
# clap, tracing-subscriber and any other surface crate here.
[dependencies]
cw-base = { workspace = true }
tmpl-cli-store = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
cw-testkit = { workspace = true }
# The crate's own integration tests run the apps through `test-support`.
tmpl-cli-core = { path = ".", features = ["test-support"] }
# The integration tests name the kit's file error behind a store failure.
cw-fs = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true, features = ["macros"] }

[lints]
workspace = true
