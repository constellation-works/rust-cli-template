[package]
name = "tmpl-cli-core"
description = "The tmpl-cli apps as a library: one exec per app, the runtime they share, and composition. No terminal, no argument parsing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "tmpl_cli_core"
path = "src/lib.rs"

# Domain dependencies only. scripts/check-dependency-direction.sh rejects
# clap, tracing-subscriber and any other surface crate here.
[dependencies]
cw-app = { workspace = true }
cw-base = { workspace = true }
tmpl-cli-store = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
cw-testkit = { workspace = true }
# Hand-made store state (a bad record, the last id, a newer schema) for
# the tests, through the store's raw-SQL test support.
tmpl-cli-store = { workspace = true, features = ["test-support"] }
serde_json = { workspace = true }
time = { workspace = true, features = ["macros"] }

[lints]
workspace = true
